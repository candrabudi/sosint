# SOSINT: panel + API (sosint-panel-1, port 6020), /opt/sosint.
# Install: cp deploy/mailcow-sosint.conf /opt/mailcow-dockerized/data/conf/nginx/sosint.conf
#   docker exec mailcowdockerized-nginx-mailcow-1 nginx -t && docker exec mailcowdockerized-nginx-mailcow-1 nginx -s reload
# Hanya hostname ini yang ditangani; Cloudflare (SSL "Full") di depan.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name sosint.devchio.tech;
  ssl_certificate /etc/ssl/mail/cert.pem;
  ssl_certificate_key /etc/ssl/mail/key.pem;
  include /etc/nginx/conf.d/gregsbananacake-cloudflare.inc;
  client_max_body_size 4m;

  location / {
    proxy_pass http://172.22.1.1:6020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
